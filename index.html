<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2B1F35" />

    <title>Sarra Ben Thayer — Data Engineer</title>
    <meta
      name="description"
      content="Sarra Ben Thayer — Data Engineering & Decision Systems Engineer building data pipelines, streaming architectures and AI-powered data systems."
    />
    <meta name="author" content="Sarra Ben Thayer" />

    <!-- Social preview (LinkedIn, WhatsApp, X…). VITE_SITE_URL is set in .env -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Sarra Ben Thayer" />
    <meta property="og:title" content="Sarra Ben Thayer — Data Engineer" />
    <meta
      property="og:description"
      content="Data Engineering & Decision Systems Engineer — I build data pipelines and turn raw data into decisions."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sarra Ben Thayer — Data Engineering & Decision Systems Engineer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sarra Ben Thayer — Data Engineer" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
